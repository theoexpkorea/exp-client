<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="추천매물">

<!-- OG 태그 (카톡/SNS 링크 미리보기) -->
<meta property="og:title" content="theo · 추천 매물">
<meta property="og:description" content="담당자가 직접 선별한 추천 매물을 확인하세요.">
<meta property="og:image" content="https://theoexpkorea.github.io/exp-client/og-image.png">
<meta property="og:url" content="https://theoexpkorea.github.io/exp-client/">
<meta property="og:type" content="website">

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<title>추천 매물</title>
<style>
  :root{
    --bg:#F4F5F7; --surface:#FFFFFF; --ink:#15181E; --muted:#727A86;
    --line:#E6E8EC; --line-2:#EEF0F3; --accent:#2746E6; --accent-soft:#EEF1FE;
    --sale:#1F7A4D; --sale-bg:#E7F4ED; --jeonse:#9A5B14; --jeonse-bg:#FBF1E2;
    --wolse:#2746E6; --wolse-bg:#EEF1FE; --chip:#F1F2F5;
    --shadow:0 1px 2px rgba(20,24,32,.04),0 6px 16px rgba(20,24,32,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0; overscroll-behavior-y:none; height:100%}
  *{-webkit-touch-callout:none; -webkit-user-select:none; user-select:none;}
  input, textarea{-webkit-user-select:text; user-select:text; -webkit-touch-callout:default;}
  body{
    font-family:"Pretendard","Pretendard Variable",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    background:var(--bg); color:var(--ink);
    font-feature-settings:"tnum" 1; -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  .tnum{font-variant-numeric:tabular-nums}

  /* Header */
  header{
    position:fixed; top:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; z-index:30; background:var(--surface);
    border-bottom:1px solid var(--line); border-left:1px solid var(--line); border-right:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 16px) 16px 16px;
    box-sizing:border-box;
  }
  @media (min-width:481px){
    body{background:var(--line-2)}
  }
  .head-row{display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:26px; margin-bottom:4px}
  .brand{display:flex; align-items:baseline; gap:8px}
  .brand .logo{font-size:21px; font-weight:800; letter-spacing:-.04em; margin:0; color:var(--ink); line-height:1; cursor:pointer; text-decoration:none; position:relative; z-index:10;}
  .brand .logo .o{color:var(--accent)}
  .brand .by{font-size:11px; color:var(--muted); font-weight:600; letter-spacing:.02em}
  .count{font-size:13px; color:var(--muted); font-weight:600}
  .count b{color:var(--accent); font-weight:800}

  /* 고객명 + 지도 통합 카드 */
  .info-card{
    margin:12px 0 4px; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:13px 15px; box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .info-card .cl-name{
    font-size:14.5px; font-weight:800; color:var(--ink); letter-spacing:-.01em;
    line-height:1.35; word-break:keep-all;
  }
  .info-card .cl-date{
    font-size:11.5px; color:var(--muted); font-weight:600; margin-top:3px;
  }
  .map-chip{
    flex-shrink:0; display:flex; align-items:center; height:34px; padding:0 14px;
    border-radius:17px; background:var(--accent-soft); color:var(--accent);
    font-size:12.5px; font-weight:800; border:1px solid #D7DEFB;
    cursor:pointer; text-decoration:none; font-family:inherit; white-space:nowrap;
  }
  .map-chip svg{flex-shrink:0; margin-right:6px}
  .map-chip:active{opacity:.8}

  /* list */
  main{max-width:480px; margin:0 auto; box-sizing:border-box; padding:12px 12px calc(env(safe-area-inset-bottom) + 100px)}
  @media (min-width:481px){
    main{background:var(--bg); border-left:1px solid var(--line); border-right:1px solid var(--line); min-height:100vh}
  }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:14px 15px; margin:0 4px 11px; box-shadow:var(--shadow);
  }
  .card-top{display:flex; align-items:center; gap:6px; margin-bottom:9px; flex-wrap:wrap}
  .tag{font-size:11.5px; font-weight:800; padding:3px 8px; border-radius:7px; letter-spacing:-.01em}
  .tag.t-type{background:#F0F1F4; color:#3B414C}
  .tag.t-deal.매매{background:var(--sale-bg); color:var(--sale)}
  .tag.t-deal.전세{background:var(--jeonse-bg); color:var(--jeonse)}
  .tag.t-deal.월세{background:var(--wolse-bg); color:var(--wolse)}
  .tag.t-deal.단기임대{background:#E9EDF5; color:#5A6B86}

  .thumb{float:right; width:84px; height:84px; border-radius:9px; overflow:hidden; margin:0 0 8px 12px; background:#EEF0F3; cursor:zoom-in; position:relative}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block}
  .thumb-count{position:absolute; top:4px; right:4px; background:rgba(10,12,16,.72); color:#fff;
    font-size:10.5px; font-weight:700; padding:2px 6px; border-radius:20px; line-height:1.3}

  /* 사진 확대보기 라이트박스 */
  .photo-lb{position:fixed; inset:0; background:rgba(10,12,16,.92); z-index:2000;
    display:flex; align-items:center; justify-content:center; padding:24px;
    opacity:0; pointer-events:none; transition:.2s; box-sizing:border-box}
  .photo-lb.on{opacity:1; pointer-events:auto}
  .photo-lb img{max-width:100%; max-height:100%; width:auto; height:auto; border-radius:10px; object-fit:contain; cursor:zoom-out}
  .photo-lb-close{position:absolute; top:16px; right:16px; z-index:2001;
    width:38px; height:38px; border-radius:50%; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.14); color:#fff; transition:background .15s}
  .photo-lb-close:active{background:rgba(255,255,255,.28)}
  .photo-lb-nav{position:absolute; top:50%; transform:translateY(-50%); z-index:2001;
    width:44px; height:44px; border-radius:50%; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.14); color:#fff; transition:background .15s}
  .photo-lb-nav:active{background:rgba(255,255,255,.28)}
  .photo-lb-prev{left:12px}
  .photo-lb-next{right:12px}
  .photo-lb-count{position:absolute; bottom:18px; left:50%; transform:translateX(-50%); z-index:2001;
    background:rgba(0,0,0,.5); color:#fff; font-size:12.5px; padding:4px 12px; border-radius:20px}
  .bldg{font-size:16.5px; font-weight:800; letter-spacing:-.02em; line-height:1.3; margin:0 0 3px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .addr-row{margin:0 0 11px}
  .addr{font-size:12.5px; color:var(--muted); line-height:1.4; margin:0;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .addr-map-link{display:inline-flex; align-items:center; vertical-align:-3px;
    margin-left:4px; color:#8a8d94; transition:color .15s}
  .addr-map-link:active{color:#03C75A}

  .price{font-size:18px; font-weight:800; letter-spacing:-.02em; margin-bottom:10px}
  .price .lbl{font-size:12.5px; font-weight:700; color:var(--muted); margin-right:5px}
  .price .sep{color:var(--line); margin:0 7px; font-weight:600}
  .extras{display:flex; column-gap:16px; row-gap:4px; margin:-3px 0 10px; flex-wrap:wrap}
  .extras .ex{font-size:13.5px; font-weight:800; letter-spacing:-.01em}
  .extras .ek{font-size:11.5px; font-weight:700; color:var(--muted); margin-right:5px}

  .meta{display:flex; gap:0; border-top:1px solid var(--line-2); padding-top:10px; clear:both}
  .meta .m{flex:1; min-width:0}
  .meta .m + .m{border-left:1px solid var(--line-2); padding-left:12px}
  .meta .k{font-size:10.5px; color:#9aa1ab; font-weight:700; letter-spacing:.01em; margin-bottom:2px}
  .meta .v{font-size:13.5px; font-weight:800; letter-spacing:-.01em}

  /* 서류 버튼: 화면 폭과 무관하게 항상 3열 고정 */
  .doc-btns{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:7px; margin-top:10px; clear:both}
  .doc-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:5px;
    padding:6px 8px; border-radius:8px; font-size:11.5px; font-weight:700;
    line-height:1.25; text-align:center;
    text-decoration:none; border:1.5px solid var(--line);
    color:var(--muted); background:var(--surface);
    transition:all .15s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .doc-btn:active{opacity:.75}

  /* 상권정보 요약 줄 + 팝업 막대그래프 */
  .trade-chip{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700;
    padding:4px 9px; border-radius:999px; background:var(--accent-soft); color:var(--accent)}
  .trade-bar-row{display:flex; align-items:center; gap:10px; padding:7px 2px}
  .trade-bar-name{font-size:12.5px; width:88px; flex:none; color:var(--ink); font-weight:700;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .trade-bar-track{flex:1; height:7px; background:var(--line-2); border-radius:4px; overflow:hidden}
  .trade-bar-fill{height:100%; background:var(--accent); border-radius:4px}
  .trade-bar-count{font-size:12.5px; font-weight:800; width:28px; text-align:right; color:var(--ink)}

  /* 중개사 추천 멘트 팝업 */
  .note-overlay{
    position:fixed; inset:0; z-index:200; background:rgba(15,18,24,.45);
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .note-overlay.show{display:flex}
  .note-sheet{
    width:100%; max-width:400px; background:var(--surface);
    border-radius:18px; padding:20px;
    box-sizing:border-box; max-height:80vh; overflow-y:auto;
    animation:noteUp .18s ease-out;
  }
  @keyframes noteUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
  .note-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; font-size:14.5px; font-weight:800; color:var(--ink)}
  .note-head-title{display:flex; align-items:center; gap:7px}
  .note-close{
    flex:none; width:28px; height:28px; border-radius:50%; background:var(--bg); border:0;
    display:flex; align-items:center; justify-content:center; color:var(--muted); cursor:pointer; font-size:14px;
  }
  .note-close:active{opacity:.7}
  .note-body{
    background:var(--accent-soft); border-radius:12px; padding:14px 15px;
    font-size:14px; line-height:1.65; color:var(--ink); white-space:pre-line;
  }
  .note-agent{display:flex;align-items:center;gap:6px;margin-top:12px;justify-content:flex-end}
  .note-agent .av{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .note-agent span{font-size:12px;color:var(--muted);font-weight:600}

  .empty{text-align:center; padding:64px 24px; color:var(--muted)}
  .empty .em-t{font-size:15px; font-weight:700; color:var(--ink); margin-bottom:6px}
  .empty .em-s{font-size:13px}

  /* 하단 고정 연락 버튼 */
  .contact-bar{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; box-sizing:border-box; z-index:40;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:var(--surface); border-top:1px solid var(--line); border-left:1px solid var(--line); border-right:1px solid var(--line);
    display:none; gap:10px;
  }
  .contact-btn{
    flex:1; height:52px; border:0; border-radius:13px;
    font-size:15px; font-weight:800; cursor:pointer;
    font-family:inherit; display:flex; align-items:center;
    justify-content:center; gap:7px; text-decoration:none;
  }
  .contact-btn.tel{background:#4B5875; color:#fff;}
  .contact-btn.kakao{background:#FEE500; color:#191600;}
  .contact-btn:active{opacity:.85}

  /* 로딩 */
  .loading{text-align:center; padding:80px 24px; color:var(--muted)}
  .loading .sp{display:inline-block; width:28px; height:28px; border:3px solid var(--line);
    border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; margin-bottom:12px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* 재시도 버튼 (에러 화면용) */
  .retry-btn{
    margin-top:16px; padding:11px 22px; border:1.5px solid var(--accent);
    border-radius:11px; background:var(--accent-soft); color:var(--accent);
    font-size:14px; font-weight:800; cursor:pointer; font-family:inherit;
  }
  .retry-btn:active{opacity:.8}

  /* 비번 화면 */
  #lockScreen{
    position:fixed; inset:0; z-index:999;
    background:var(--bg);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:32px 24px;
    padding-top:calc(env(safe-area-inset-top) + 32px);
  }
  #lockScreen .lock-logo{
    font-size:28px; font-weight:800; letter-spacing:-.04em;
    margin-bottom:6px; color:var(--ink);
  }
  #lockScreen .lock-logo .o{color:var(--accent)}
  #lockScreen .lock-sub{
    font-size:13px; color:var(--muted); font-weight:600;
    margin-bottom:40px;
  }
  #lockScreen .lock-box{
    width:100%; max-width:320px;
    background:var(--surface); border-radius:18px;
    padding:28px 24px; box-shadow:var(--shadow);
    border:1px solid var(--line);
  }
  #lockScreen .lock-title{
    font-size:15px; font-weight:800; color:var(--ink);
    margin-bottom:16px; text-align:center;
  }
  #lockScreen .lock-input{
    width:100%; height:52px;
    border:1px solid var(--line); border-radius:12px;
    background:var(--bg); padding:0 16px;
    font-size:20px; font-family:inherit;
    text-align:center; letter-spacing:6px;
    outline:0; color:var(--ink);
    font-variant-numeric:tabular-nums;
    margin-bottom:12px;
  }
  #lockScreen .lock-input:focus{border-color:var(--accent); background:#fff}
  #lockScreen .lock-btn{
    width:100%; height:52px; border:0; border-radius:13px;
    background:var(--ink); color:#fff;
    font-size:15.5px; font-weight:800; cursor:pointer;
    font-family:inherit;
  }
  #lockScreen .lock-btn:active{opacity:.85}
  #lockScreen .lock-btn2{
    width:100%; height:46px; border:1.5px solid var(--accent); border-radius:12px;
    background:var(--accent-soft); color:var(--accent);
    font-size:14px; font-weight:800; cursor:pointer;
    font-family:inherit; margin-top:10px; transition:background .15s, border-color .15s, color .15s;
  }
  #lockScreen .lock-btn2:active{opacity:.8}
  #lockScreen .lock-btn2.copied{
    background:var(--accent); border-color:var(--accent); color:#fff;
  }
  #lockScreen .lock-status{
    font-size:12.5px; font-weight:700; color:var(--muted, #9aa1ab);
    text-align:center; margin-top:8px; min-height:0;
  }
  #lockScreen .lock-status.err{ color:#E03A3A; }
</style>
</head>
<body>
<script>
  // 화면이 그려지기 전에 미리 판단: id 파라미터 없으면 코드입력 화면 모드로 즉시 전환 (깜빡임 방지)
  if(!new URLSearchParams(location.search).get("id")){
    document.documentElement.classList.add("mode-code");
  }
</script>
<style>
  html.mode-code #lockScreen{display:flex !important}
  html.mode-code header, html.mode-code main, html.mode-code .contact-bar{display:none !important}
</style>

<!-- 접속코드 입력 화면 (URL에 id 파라미터 없을 때 표시) -->
<div id="lockScreen" style="display:none">
  <div class="lock-logo">the<span class="o">o</span></div>
  <div class="lock-sub">추천매물 · eXp Korea</div>
  <div class="lock-box">
    <div class="lock-title"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;vertical-align:-2px;margin-right:4px;"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>접속 코드를 입력하세요.</div>
    <input id="lockInput" class="lock-input" type="text"
      inputmode="text" maxlength="20" placeholder="예: NR-외과"
      autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false"
      style="letter-spacing:2px; text-transform:uppercase;">
    <button class="lock-btn" id="lockBtn">이동</button>
    <button class="lock-btn2" id="copyBtn">💬 카톡전송 주소 복사</button>
    <div class="lock-status" id="lockStatus"></div>
  </div>
</div>

<header>
  <div class="head-row">
    <div class="brand">
      <span class="logo" onclick="const p=new URLSearchParams(location.search); const id=p.get('id'); if(id) location.href=location.pathname+'?id='+id;">the<span class="o">o</span></span>
      <span class="by">추천매물 · eXp Korea</span>
    </div>
    <div class="count"><b id="cnt">0</b>건</div>
  </div>

  <!-- 고객명 + 지도 통합 카드 -->
  <div class="info-card" id="clientBanner" style="display:none">
    <div style="min-width:0">
      <div class="cl-name" id="clientName"></div>
      <div class="cl-date" id="clientDate"></div>
    </div>
    <a class="map-chip" id="mapLink" href="#" target="_blank" style="display:none">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
      </svg>추천매물 지도
    </a>
  </div>
</header>
<div id="headerSpacer"></div>

<div class="photo-lb" id="photoLb" onclick="closePhotoLb()">
  <button class="photo-lb-close" onclick="event.stopPropagation();closePhotoLb()" aria-label="닫기"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="4" y1="4" x2="20" y2="20"/><line x1="20" y1="4" x2="4" y2="20"/></svg></button>
  <button class="photo-lb-nav photo-lb-prev" id="photoLbPrev" onclick="event.stopPropagation();photoLbNav(-1)" aria-label="이전 사진"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
  <img id="photoLbImg" src="" alt="" onclick="event.stopPropagation()">
  <button class="photo-lb-nav photo-lb-next" id="photoLbNext" onclick="event.stopPropagation();photoLbNav(1)" aria-label="다음 사진"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
  <div class="photo-lb-count" id="photoLbCount"></div>
</div>

<main id="list">
  <div class="loading">
    <div class="sp"></div>
    <div>매물 불러오는 중...</div>
  </div>
</main>

<!-- 하단 연락 버튼 -->
<div class="contact-bar">
  <a class="contact-btn tel" id="telBtn" href="tel:010-0000-0000">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.63 3.4 2 2 0 0 1 3.6 1.22h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.82a16 16 0 0 0 6.29 6.29l.95-.95a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
    </svg>
    전화 상담
  </a>

  const lockInput  = document.getElementById("lockInput");
  const lockBtn    = document.getElementById("lockBtn");
  const copyBtn    = document.getElementById("copyBtn");
  const lockStatus = document.getElementById("lockStatus");

  function setStatus(msg, isErr){
    lockStatus.textContent = msg || "";
    lockStatus.classList.toggle("err", !!isErr);
  }

  function getCode(){
    const raw = lockInput.value.trim().toUpperCase();
    if(!raw){
      setStatus("코드를 입력해 주세요.", true);
      return null;

    setStatus("");
    return raw;
  }
  function buildUrl(code){
    return location.origin + location.pathname + "?id=" + encodeURIComponent(code);

  function goToCode(){
    const code = getCode();
    if(!code) return;
    location.href = buildUrl(code);

    const code = getCode();
    if(!code) return;
    const url = buildUrl(code);

      }, 1600);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>done(true)).catch(()=>done(false));

/* ===================== 금액 포맷 ===================== */
function won(manwon){
  if(manwon==null || manwon==="-" || manwon===0) return "-";
  const n=Math.round(manwon);
  const eok=Math.floor(n/10000), man=n%10000;
  if(eok>0 && man>0) return `${eok}억 ${man.toLocaleString()}만`;
  if(eok>0) return `${eok}억`;
  return `${man.toLocaleString()}만`;
}
function priceLine(d){
  if(d.deal==="매매") return `<span class="lbl">매매</span>${won(d.sale)}`;
  if(d.deal==="전세") return `<span class="lbl">전세</span>${won(d.deposit)}`;
  return `<span class="lbl">보증</span>${won(d.deposit)}<span class="sep">/</span><span class="lbl">월</span>${won(d.rent)}`;
}
function fnum(v,dec){
  if(v==null||v==="-"||v===""||isNaN(+v)) return v;
  return (+(+v).toFixed(dec)).toLocaleString();
}
function extrasLine(d){
  const bits=[];
  const isNA=v=>(v==null||v===""||v==="-");
  const escT=v=>String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const cell=(label,v)=>{
    if(isNA(v)) return null;
    const n=Number(v); if(isNaN(n)) return null;
    return `<span class="ex"><span class="ek">${label}</span>${n>0?won(v):"없음"}</span>`;
  };
  const txt=(label,v)=>{
    if(isNA(v)) return null;
    return `<span class="ex"><span class="ek">${label}</span>${escT(v)}</span>`;
  };
  const m=cell("관리비",d.mgmt); if(m) bits.push(m);
  const mv=txt("입주가능",d.movein); if(mv) bits.push(mv);
  return bits.length?`<div class="extras tnum">${bits.join("")}</div>`:"";
}

/* ===================== 사진 확대보기 라이트박스 (여러 장 갤러리) ===================== */
var PHOTO_SETS = [];
var photoLbCur = null;

function regPhotos(photos){
  PHOTO_SETS.push(photos);
  return PHOTO_SETS.length - 1;
}
function openPhotoLb(setIdx){
  var photos = PHOTO_SETS[setIdx];
  if(!photos || !photos.length) return;
  photoLbCur = { photos: photos, idx: 0 };
  renderPhotoLb();
  document.getElementById("photoLb").classList.add("on");
}
function renderPhotoLb(){
  if(!photoLbCur) return;
  var p = photoLbCur.photos[photoLbCur.idx];
  document.getElementById("photoLbImg").src = (p.full || p.thumb || p);
  var multi = photoLbCur.photos.length > 1;
  document.getElementById("photoLbPrev").style.display = multi ? "flex" : "none";
  document.getElementById("photoLbNext").style.display = multi ? "flex" : "none";
  var countEl = document.getElementById("photoLbCount");
  if(multi){
    countEl.style.display = "block";
    countEl.textContent = (photoLbCur.idx + 1) + " / " + photoLbCur.photos.length;
  } else {
    countEl.style.display = "none";
  }
}
function photoLbNav(dir){
  if(!photoLbCur) return;
  var n = photoLbCur.photos.length;
  photoLbCur.idx = (photoLbCur.idx + dir + n) % n;
  renderPhotoLb();
}
function closePhotoLb(){
  document.getElementById("photoLb").classList.remove("on");
  document.getElementById("photoLbImg").src = "";
  photoLbCur = null;
}
document.addEventListener("keydown", function(e){
  if(!document.getElementById("photoLb").classList.contains("on")) return;
  if(e.key === "Escape") closePhotoLb();
  else if(e.key === "ArrowLeft") photoLbNav(-1);
  else if(e.key === "ArrowRight") photoLbNav(1);
});
(function(){
  var startX = null, startY = null;
  var box = document.getElementById("photoLb");
  box.addEventListener("touchstart", function(e){
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, {passive:true});
  box.addEventListener("touchmove", function(e){
    if(startX === null) return;
    var dx = e.touches[0].clientX - startX;
    var dy = e.touches[0].clientY - startY;
    if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) e.preventDefault();
  }, {passive:false});
  box.addEventListener("touchend", function(e){
    if(startX === null) return;
    var dx = e.changedTouches[0].clientX - startX;
    if(Math.abs(dx) > 40) photoLbNav(dx > 0 ? -1 : 1);
    startX = null; startY = null;
  }, {passive:true});
})();

/* ===================== 데이터 로드 (JSONP + 재시도) ===================== */
function loadDataOnce(url, timeoutMs){
  return new Promise(function(resolve,reject){
    const cb="__client_cb_"+Date.now()+"_"+Math.floor(Math.random()*100000);
    const s=document.createElement("script");
    let done=false;
    window[cb]=function(data){ done=true; cleanup(); resolve(data); };
    function cleanup(){ try{delete window[cb];}catch(e){} if(s.parentNode) s.parentNode.removeChild(s); }
    s.onerror=function(){ if(!done){ cleanup(); reject(new Error("load fail")); } };
    const sep=url.indexOf("?")>=0?"&":"?";
    s.src=url+sep+"callback="+cb;
    document.head.appendChild(s);
    setTimeout(function(){ if(!done){ cleanup(); reject(new Error("timeout")); } }, timeoutMs);
  });
}

// 타임아웃 20초로 연장 + 실패 시 1회 자동 재시도(짧은 대기 후)
async function loadData(url){
  try{
    return await loadDataOnce(url, 30000);
  }catch(e){
    await new Promise(r=>setTimeout(r, 800));
    return await loadDataOnce(url, 30000);
  }
}

/* ===================== 에러 화면 ===================== */
function showLoadError(){
  document.getElementById("list").innerHTML =
    `<div class="empty">
      <div class="em-t">연결이 원활하지 않습니다.</div>
      <div class="em-s">네트워크 상태를 확인하고 다시 시도해 주세요.</div>
      <button class="retry-btn" onclick="boot()">다시 시도</button>
    </div>`;
}

/* ===================== 부팅 ===================== */
async function boot(){
  if(!clientId){
    document.getElementById("list").innerHTML=
      `<div class="empty"><div class="em-t">잘못된 접근입니다.</div><div class="em-s">담당자에게 링크를 다시 요청해 주세요.</div></div>`;
    return;
  }

  const cacheKey = "theo_client_cache_" + clientId;
  let cachedRes = null;
  try{
    const raw = localStorage.getItem(cacheKey);
    if(raw) cachedRes = JSON.parse(raw);
  }catch(e){}

  if(cachedRes && !cachedRes.error){
    applyResult(cachedRes);
  } else {
    document.getElementById("list").innerHTML = `
      <div class="loading">
        <div class="sp"></div>
        <div>매물 불러오는 중...</div>
      </div>`;
  }

  try{
    const url = CONFIG.DATA_URL + "?mode=client&id=" + encodeURIComponent(clientId);
    const res  = await loadData(url);

    if(res.error){
      // 서버가 에러를 주면 캐시 삭제 (종료된 고객이 캐시로 계속 보는 것 방지)
      try{ localStorage.removeItem(cacheKey); }catch(e){}

      if(res.error === "EXPIRED"){
        document.getElementById("clientBanner").style.display = "none";
        document.getElementById("cnt").textContent = "0";
        if(!res.hideContact){
          document.querySelector(".contact-bar").style.display = "flex";
        }
        document.getElementById("list").innerHTML=
          `<div class="empty"><div class="em-t">추천이 종료되었습니다.</div><div class="em-s">새로운 매물 추천이 필요하시면<br>아래 버튼으로 문의해 주세요.</div></div>`;
      } else {
        document.getElementById("list").innerHTML=
          `<div class="empty"><div class="em-t">매물을 불러올 수 없습니다.</div><div class="em-s">담당자에게 링크를 다시 요청해 주세요.</div></div>`;
      }
      return;
    }

    applyResult(res);
    try{ localStorage.setItem(cacheKey, JSON.stringify(res)); }catch(e){}

  } catch(e){
    if(!cachedRes) showLoadError();
  }
}

function syncHeaderSpacer(){
  const h = document.querySelector("header");
  const sp = document.getElementById("headerSpacer");
  if(h && sp) sp.style.height = h.offsetHeight + "px";
}
window.addEventListener("resize", syncHeaderSpacer);
window.addEventListener("orientationchange", ()=>setTimeout(syncHeaderSpacer, 200));

function applyResult(res){
  HIDE_TRADE = !!res.hideTrade;
  HIDE_PROPOSAL = !!res.hideProposal;
  HIDE_EUM = !!res.hideEum;
  HIDE_SEMAS = !!res.hideSemas;
  HIDE_TRADE_REPORT = !!res.hideTradeReport;
  HIDE_CONTACT = !!res.hideContact;
  HIDE_REGISTRY = !!res.hideRegistry;
  SHOW_DOCS = !!res.showDocs;
  // 고객명 배너
  if(res.clientName){
    document.getElementById("clientName").textContent = res.clientName + " 고객님";
    document.getElementById("clientDate").textContent = new Date().toLocaleDateString("ko-KR");
  }

  // 지도 칩
  if(res.mapUrl){
    document.getElementById("mapLink").href = res.mapUrl;
    document.getElementById("mapLink").style.display = "flex";
  }

  // 고객명 또는 지도 링크 중 하나라도 있으면 카드 표시
  if(res.clientName || res.mapUrl){
    document.getElementById("clientBanner").style.display = "flex";
  }

  // 중개사면 버튼 숨김, 고객이면 표시 (단, 연락버튼 숨김 옵션이 켜져 있으면 고객이어도 숨김)
  if(!res.isAgent && !HIDE_CONTACT){
    document.querySelector(".contact-bar").style.display = "flex";
  }

  render(res.items || []);
  syncHeaderSpacer();
}

syncHeaderSpacer();
if(clientId) boot();
</script>
</body>
</html>
