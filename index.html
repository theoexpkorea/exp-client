<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2746E6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- OG 태그 (카톡/SNS 링크 미리보기) -->
<meta property="og:title" content="theo · 추천 매물">
<meta property="og:description" content="담당자가 직접 선별한 추천 매물을 확인하세요.">
<meta property="og:image" content="https://theoexpkorea.github.io/exp-client/og-image.png">
<meta property="og:url" content="https://theoexpkorea.github.io/exp-client/">
<meta property="og:type" content="website">

<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="icon" type="image/png" href="../icon-192.png">
<title>추천 매물</title>
<style>
  :root{
    --bg:#F4F5F7; --surface:#FFFFFF; --ink:#15181E; --muted:#727A86;
    --line:#E6E8EC; --line-2:#EEF0F3; --accent:#2746E6; --accent-soft:#EEF1FE;
    --sale:#1F7A4D; --sale-bg:#E7F4ED; --jeonse:#9A5B14; --jeonse-bg:#FBF1E2;
    --wolse:#2746E6; --wolse-bg:#EEF1FE; --chip:#F1F2F5;
    --shadow:0 1px 2px rgba(20,24,32,.04),0 6px 16px rgba(20,24,32,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"Pretendard","Pretendard Variable",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    background:var(--bg); color:var(--ink);
    font-feature-settings:"tnum" 1; -webkit-font-smoothing:antialiased;
  }
  .tnum{font-variant-numeric:tabular-nums}

  /* Header */
  header{
    position:sticky; top:0; z-index:30; background:var(--surface);
    border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  }
  .head-row{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .brand{display:flex; align-items:baseline; gap:8px}
  .brand .logo{font-size:21px; font-weight:800; letter-spacing:-.04em; margin:0; color:var(--ink); line-height:1}
  .brand .logo .o{color:var(--accent)}
  .brand .by{font-size:11px; color:var(--muted); font-weight:600; letter-spacing:.02em}
  .count{font-size:13px; color:var(--muted); font-weight:600}
  .count b{color:var(--accent); font-weight:800}

  /* 고객명 배너 */
  .client-banner{
    background:var(--accent-soft); border-bottom:1px solid var(--line);
    padding:10px 16px; display:flex; align-items:center; justify-content:space-between;
  }
  .client-banner .cl-name{
    font-size:13px; font-weight:700; color:var(--accent);
  }
  .client-banner .cl-date{
    font-size:11.5px; color:var(--muted); font-weight:600;
  }

  /* 지도 버튼 */
  .map-bar{
    padding:10px 16px; background:var(--surface);
    border-bottom:1px solid var(--line);
  }
  .map-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; height:42px; border:1.5px solid var(--accent);
    border-radius:11px; background:var(--accent-soft);
    color:var(--accent); font-size:14px; font-weight:800;
    cursor:pointer; text-decoration:none; font-family:inherit;
  }
  .map-btn:active{opacity:.8}

  /* list */
  main{padding:12px 12px calc(env(safe-area-inset-bottom) + 100px)}
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:14px 15px; margin:0 4px 11px; box-shadow:var(--shadow);
  }
  .card-top{display:flex; align-items:center; gap:6px; margin-bottom:9px; flex-wrap:wrap}
  .tag{font-size:11.5px; font-weight:800; padding:3px 8px; border-radius:7px; letter-spacing:-.01em}
  .tag.t-type{background:#F0F1F4; color:#3B414C}
  .tag.t-deal.매매{background:var(--sale-bg); color:var(--sale)}
  .tag.t-deal.전세{background:var(--jeonse-bg); color:var(--jeonse)}
  .tag.t-deal.월세{background:var(--wolse-bg); color:var(--wolse)}
  .tag.t-deal.단기임대{background:#E9EDF5; color:#5A6B86}

  .thumb{float:right; width:84px; height:84px; border-radius:9px; overflow:hidden; margin:0 0 8px 12px; background:#EEF0F3}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block}
  .bldg{font-size:16.5px; font-weight:800; letter-spacing:-.02em; line-height:1.3; margin:0 0 3px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .addr{font-size:12.5px; color:var(--muted); line-height:1.4; margin:0 0 11px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}

  .price{font-size:18px; font-weight:800; letter-spacing:-.02em; margin-bottom:10px}
  .price .lbl{font-size:12.5px; font-weight:700; color:var(--muted); margin-right:5px}
  .price .sep{color:var(--line); margin:0 7px; font-weight:600}
  .extras{display:flex; gap:16px; margin:-3px 0 10px; flex-wrap:wrap}
  .extras .ex{font-size:13.5px; font-weight:800; letter-spacing:-.01em}
  .extras .ek{font-size:11.5px; font-weight:700; color:var(--muted); margin-right:5px}

  .meta{display:flex; gap:0; border-top:1px solid var(--line-2); padding-top:10px; clear:both}
  .meta .m{flex:1; min-width:0}
  .meta .m + .m{border-left:1px solid var(--line-2); padding-left:12px}
  .meta .k{font-size:10.5px; color:#9aa1ab; font-weight:700; letter-spacing:.01em; margin-bottom:2px}
  .meta .v{font-size:13.5px; font-weight:800; letter-spacing:-.01em}

  .empty{text-align:center; padding:64px 24px; color:var(--muted)}
  .empty .em-t{font-size:15px; font-weight:700; color:var(--ink); margin-bottom:6px}
  .empty .em-s{font-size:13px}

  /* 하단 고정 연락 버튼 */
  .contact-bar{
    position:fixed; bottom:0; left:0; right:0; z-index:40;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:var(--surface); border-top:1px solid var(--line);
    display:none; gap:10px;
  }
  .contact-btn{
    flex:1; height:52px; border:0; border-radius:13px;
    font-size:15px; font-weight:800; cursor:pointer;
    font-family:inherit; display:flex; align-items:center;
    justify-content:center; gap:7px; text-decoration:none;
  }
  .contact-btn.tel{background:var(--ink); color:#fff;}
  .contact-btn.kakao{background:#FEE500; color:#191600;}
  .contact-btn:active{opacity:.85}

  /* 로딩 */
  .loading{text-align:center; padding:80px 24px; color:var(--muted)}
  .loading .sp{display:inline-block; width:28px; height:28px; border:3px solid var(--line);
    border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; margin-bottom:12px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* 비번 화면 */
  #lockScreen{
    position:fixed; inset:0; z-index:999;
    background:var(--bg);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:32px 24px;
    padding-top:calc(env(safe-area-inset-top) + 32px);
  }
  #lockScreen .lock-logo{
    font-size:28px; font-weight:800; letter-spacing:-.04em;
    margin-bottom:6px; color:var(--ink);
  }
  #lockScreen .lock-logo .o{color:var(--accent)}
  #lockScreen .lock-sub{
    font-size:13px; color:var(--muted); font-weight:600;
    margin-bottom:40px;
  }
  #lockScreen .lock-box{
    width:100%; max-width:320px;
    background:var(--surface); border-radius:18px;
    padding:28px 24px; box-shadow:var(--shadow);
    border:1px solid var(--line);
  }
  #lockScreen .lock-title{
    font-size:15px; font-weight:800; color:var(--ink);
    margin-bottom:16px; text-align:center;
  }
  #lockScreen .lock-input{
    width:100%; height:52px;
    border:1px solid var(--line); border-radius:12px;
    background:var(--bg); padding:0 16px;
    font-size:20px; font-family:inherit;
    text-align:center; letter-spacing:6px;
    outline:0; color:var(--ink);
    font-variant-numeric:tabular-nums;
    margin-bottom:12px;
  }
  #lockScreen .lock-input:focus{border-color:var(--accent); background:#fff}
  #lockScreen .lock-btn{
    width:100%; height:52px; border:0; border-radius:13px;
    background:var(--ink); color:#fff;
    font-size:15.5px; font-weight:800; cursor:pointer;
    font-family:inherit;
  }
  #lockScreen .lock-btn:active{opacity:.85}
  #lockScreen .lock-err{
    font-size:13px; font-weight:700; color:#E03A3A;
    text-align:center; margin-top:10px; min-height:20px;
  }
</style>
</head>
<body>

<!-- 비밀번호 화면 (고객용은 기본 숨김 — id 파라미터로 접근) -->
<div id="lockScreen" style="display:none">
  <div class="lock-logo">the<span class="o">o</span></div>
  <div class="lock-sub">추천 매물 서비스</div>
  <div class="lock-box">
    <div class="lock-title">🔒 접근 코드를 입력하세요</div>
    <input id="lockInput" class="lock-input" type="password"
      inputmode="numeric" maxlength="8" placeholder="••••"
      autocomplete="off">
    <button class="lock-btn" id="lockBtn">확인</button>
    <div class="lock-err" id="lockErr"></div>
  </div>
</div>

<header>
  <div class="head-row">
    <div class="brand">
      <span class="logo">the<span class="o">o</span></span>
      <span class="by">추천매물 · eXp</span>
    </div>
    <div class="count"><b id="cnt">0</b>건</div>
  </div>
</header>

<!-- 고객명 배너 -->
<div class="client-banner" id="clientBanner" style="display:none">
  <span class="cl-name" id="clientName"></span>
  <span class="cl-date" id="clientDate"></span>
</div>

<!-- 지도 버튼 -->
<div class="map-bar" id="mapBar" style="display:none">
  <a class="map-btn" id="mapLink" href="#" target="_blank">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
    </svg>
    추천 매물 지도 보기
  </a>
</div>

<main id="list">
  <div class="loading">
    <div class="sp"></div>
    <div>매물 불러오는 중...</div>
  </div>
</main>

<!-- 하단 연락 버튼 -->
<div class="contact-bar">
  <a class="contact-btn tel" id="telBtn" href="tel:010-0000-0000">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.63 3.4 2 2 0 0 1 3.6 1.22h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.82a16 16 0 0 0 6.29 6.29l.95-.95a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
    </svg>
    전화 상담
  </a>
  <a class="contact-btn kakao" id="kakaoBtn" href="#" target="_blank">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 3C6.477 3 2 6.477 2 10.5c0 2.578 1.5 4.84 3.75 6.27L4.5 21l4.72-2.36A11.3 11.3 0 0 0 12 18c5.523 0 10-3.477 10-7.5S17.523 3 12 3z"/>
    </svg>
    카톡 상담
  </a>
</div>

<script>
/* ===================== 설정 ===================== */
const CONFIG = {
  DATA_URL:"https://script.google.com/macros/s/AKfycbxzC5M2zFC4lfjer8Wjd3ZTY2KMTYJbdgD0_9tMsIhtSwLoQEGIchFl0ZTHEIIsvIK8/exec",
  TEL:"010-2489-4759",
  KAKAO:"https://open.kakao.com/o/skfuVxoh"
};

/* ===================== 초기화 ===================== */
// URL에서 고객코드 읽기
const params   = new URLSearchParams(location.search);
const clientId = params.get("id") || "";

// 연락 버튼 설정
document.getElementById("telBtn").href   = "tel:" + CONFIG.TEL;
document.getElementById("kakaoBtn").href = CONFIG.KAKAO;

/* ===================== 금액 포맷 ===================== */
function won(manwon){
  if(manwon==null || manwon==="-" || manwon===0) return "-";
  const n=Math.round(manwon);
  const eok=Math.floor(n/10000), man=n%10000;
  if(eok>0 && man>0) return `${eok}억 ${man.toLocaleString()}만`;
  if(eok>0) return `${eok}억`;
  return `${man.toLocaleString()}만`;
}
function priceLine(d){
  if(d.deal==="매매") return `<span class="lbl">매매</span>${won(d.sale)}`;
  if(d.deal==="전세") return `<span class="lbl">전세</span>${won(d.deposit)}`;
  return `<span class="lbl">보증</span>${won(d.deposit)}<span class="sep">/</span><span class="lbl">월</span>${won(d.rent)}`;
}
function fnum(v,dec){
  if(v==null||v==="-"||v===""||isNaN(+v)) return v;
  return (+(+v).toFixed(dec)).toLocaleString();
}
function extrasLine(d){
  const bits=[];
  const isNA=v=>(v==null||v===""||v==="-");
  const cell=(label,v)=>{
    if(isNA(v)) return null;
    const n=Number(v); if(isNaN(n)) return null;
    return `<span class="ex"><span class="ek">${label}</span>${n>0?won(v):"없음"}</span>`;
  };
  const m=cell("관리비",d.mgmt); if(m) bits.push(m);
  return bits.length?`<div class="extras tnum">${bits.join("")}</div>`:"";
}

/* ===================== 타입 색상 ===================== */
const TYPE_COLOR={
  "상가":["#E8EEFF","#2746E6"],"사무실":["#E9EAFB","#3D43C4"],
  "지식산업센터":["#E5F0FA","#1E6FB8"],"건물":["#ECEAF8","#5B3FB5"],
  "아파트":["#E4F5EA","#1F7A4D"],"오피스텔":["#E2F4F0","#0E8C7A"],
  "주택빌라":["#EBF4E0","#4F7A1F"],"원투룸":["#E1F3F7","#11789B"],
  "공장창고":["#F2EDE4","#876730"],"토지":["#FBF1DD","#9A6B14"],
  "재건축재개발":["#F6E9E2","#B05A2E"],"분양":["#F6E7F1","#A23B86"]
};
function typeStyle(t){
  const c=TYPE_COLOR[t];
  return c?`background:${c[0]};color:${c[1]}`:"background:#F0F1F4;color:#3B414C";
}

/* ===================== 렌더 ===================== */
function render(items){
  const list=document.getElementById("list");
  document.getElementById("cnt").textContent=items.length;
  if(!items.length){
    list.innerHTML=`<div class="empty"><div class="em-t">추천 매물이 없습니다</div><div class="em-s">담당자에게 문의해 주세요</div></div>`;
    return;
  }
  list.innerHTML=items.map(d=>`
    <div class="card">
      <div class="card-top">
        <span class="tag t-type" style="${typeStyle(d.type)}">${d.type}</span>
        <span class="tag t-deal ${d.deal}">${d.deal}</span>
      </div>
      ${d.photo?`<div class="thumb"><img src="${d.photo}" loading="lazy" referrerpolicy="no-referrer" alt="" onerror="this.parentNode.style.display='none'"></div>`:""}
      <div class="bldg">${d.bldg||""}</div>
      <div class="addr">${d.addr||""}</div>
      <div class="price tnum">${priceLine(d)}</div>
      ${extrasLine(d)}
      <div class="meta">
        <div class="m"><div class="k">실측면적</div><div class="v tnum">${fnum(d.pyeong,1)}평</div></div>
        <div class="m"><div class="k">전용 ㎡</div><div class="v tnum">${fnum(d.m2,1)}㎡</div></div>
      </div>
    </div>`).join("");
}

/* ===================== 데이터 로드 (JSONP) ===================== */
function loadData(url){
  return new Promise(function(resolve,reject){
    const cb="__client_cb_"+Date.now();
    const s=document.createElement("script");
    let done=false;
    window[cb]=function(data){ done=true; cleanup(); resolve(data); };
    function cleanup(){ try{delete window[cb];}catch(e){} if(s.parentNode) s.parentNode.removeChild(s); }
    s.onerror=function(){ if(!done){ cleanup(); reject(new Error("load fail")); } };
    const sep=url.indexOf("?")>=0?"&":"?";
    s.src=url+sep+"callback="+cb;
    document.head.appendChild(s);
    setTimeout(function(){ if(!done){ cleanup(); reject(new Error("timeout")); } },12000);
  });
}

/* ===================== 부팅 ===================== */
async function boot(){
  if(!clientId){
    document.getElementById("list").innerHTML=
      `<div class="empty"><div class="em-t">잘못된 접근입니다</div><div class="em-s">담당자에게 링크를 다시 요청해 주세요</div></div>`;
    return;
  }

  try{
    const url = CONFIG.DATA_URL + "?mode=client&id=" + encodeURIComponent(clientId);
    const res  = await loadData(url);

    if(res.error){
      document.getElementById("list").innerHTML=
        `<div class="empty"><div class="em-t">매물을 불러올 수 없습니다</div><div class="em-s">${res.error}</div></div>`;
      return;
    }

    // 고객명 배너
    if(res.clientName){
      document.getElementById("clientName").textContent = res.clientName + " 고객님 추천 매물";
      document.getElementById("clientDate").textContent = new Date().toLocaleDateString("ko-KR");
      document.getElementById("clientBanner").style.display = "flex";
    }

    // 지도 버튼
    if(res.mapUrl){
      document.getElementById("mapLink").href = res.mapUrl;
      document.getElementById("mapBar").style.display = "block";
    }

    // 중개사면 버튼 숨김, 고객이면 표시
    if(!res.isAgent){
      document.querySelector(".contact-bar").style.display = "flex";
    }

    render(res.items || []);

  } catch(e){
    document.getElementById("list").innerHTML=
      `<div class="empty"><div class="em-t">연결 오류</div><div class="em-s">잠시 후 다시 시도해 주세요</div></div>`;
  }
}

boot();
</script>
</body>
</html>
